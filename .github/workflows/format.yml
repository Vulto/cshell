name: Format\n\non:\n  pull_request:\n    branches: [main]\n\npermissions:\n  contents: write\n\njobs:\n  format:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Format\n        run: |\n          sudo apt-get update\n          sudo apt-get install -y clang-format\n          clang-format -i cs.c\n          git config user.name github-actions[bot]\n          git config user.email 41898282+github-actions[bot]@users.noreply.github.com\n          git add cs.c\n          git diff --cached --quiet || git commit -m "Format cs.c with clang-format"\n          git push\n      - name: Remove formatter workflow\n        run: |\n          git rm .github/workflows/format.yml\n          git commit -m "Remove temporary formatter workflow"\n          git push\n