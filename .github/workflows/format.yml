name: Format

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/format-c23
      - name: Format cs.c
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          clang-format -i cs.c
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cs.c
          git diff --cached --quiet || git commit -m "Format cs.c with clang-format"
          git push origin HEAD:fix/format-c23
