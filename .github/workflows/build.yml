name: build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: clang -std=c23 -O3 -Wall -Wextra -Werror cs.c -o cs
      - name: Smoke test
        run: |
          ./cs example.cs
