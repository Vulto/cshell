name: build
concurrency:
  group: cshell-ci
  cancel-in-progress: true

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: clang -std=c23 -O3 -Wall -Wextra -Werror cs.c -o cs

      - name: Run language examples
        shell: bash
        run: |
          set -euo pipefail

          run_example() {
            local file="$1"
            shift
            echo "RUN $file" >&2
            ./cs "$file" "$@" > /tmp/cs-example-output
          }

          check_exact() {
            printf '%s\n' "$@" > /tmp/cs-example-expected
            diff -u /tmp/cs-example-expected /tmp/cs-example-output
          }

          run_example examples/basic.cs
          check_exact hello world one two

          run_example examples/variables.cs
          check_exact 3 "name: cshell"

          run_example examples/if.cs
          check_exact if-ok

          run_example examples/while.cs
          check_exact 1 3

          run_example examples/for.cs
          check_exact 0 1 2

          run_example examples/switch.cs
          check_exact two

          run_example examples/function.cs
          check_exact 5

          run_example examples/array.cs
          check_exact main.c other.c 3 main.c other.c test.c

          run_example examples/system_variable.cs system-one system-two
          check_exact 0 2 examples/system_variable.cs system-one system-two

          run_example examples/environment.cs
          test -n "$(head -n1 /tmp/cs-example-output)"
          test -n "$(tail -n1 /tmp/cs-example-output)"

          run_example examples/arguments.cs argument-one argument-two
          check_exact 2 examples/arguments.cs argument-one argument-two

          run_example examples/strings.cs
          check_exact "single quoted" "double quoted"

          run_example examples/expressions.cs
          grep -qx '13' /tmp/cs-example-output
          grep -qx '30' /tmp/cs-example-output
          grep -qx 'expression-ok' /tmp/cs-example-output

          run_example examples/command_variable.cs
          check_exact command-variable-ok

          run_example examples/redirection.cs
          check_exact first second error

          run_example examples/pipe.cs
          check_exact 3

          run_example examples/glob.cs
          grep -q 'examples/array.cs' /tmp/cs-example-output

          run_example examples/command_substitution.cs
          check_exact substituted

          run_example examples/background.cs
          grep -q 'Running' /tmp/cs-example-output

          run_example examples/alias_history.cs
          grep -q 'alias-ok' /tmp/cs-example-output

          run_example examples/functions_return.cs
          check_exact returned

          run_example examples/cd_exit.cs
          check_exact /tmp

          run_example examples/unset.cs
          check_exact present 0

          set +e
          ./cs examples/exit.cs > /tmp/cs-example-output
          exit_status=$?
          set -e
          test "$exit_status" -eq 7
