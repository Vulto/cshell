name: build
concurrency:
  group: cshell-ci
  cancel-in-progress: true

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: clang -std=c23 -O3 -Wall -Wextra -Werror cs.c -o cs
      - name: Smoke test
        run: |
          ./cs example.cs
          printf 'echo "redirected"\n' > /tmp/cs-redirection.cs
          ./cs /tmp/cs-redirection.cs > /tmp/cs-redirection.out
          grep -qx 'redirected' /tmp/cs-redirection.out
          printf '%s\n' 'printf "%s\n" a b | wc' > /tmp/cs-pipe.cs
          ./cs /tmp/cs-pipe.cs > /tmp/cs-pipe.out
          grep -q '2' /tmp/cs-pipe.out
          printf '%s\n' 'true &' > /tmp/cs-background.cs
          ./cs /tmp/cs-background.cs > /tmp/cs-background.out 2>&1
          grep -q '\[' /tmp/cs-background.out
          printf '%s\n' 'echo *.cs' > /tmp/cs-glob.cs
          ./cs /tmp/cs-glob.cs > /tmp/cs-glob.out
          grep -q 'example.cs' /tmp/cs-glob.out
          printf '%s\n' 'alias ll = "echo alias"' 'll' 'history' | ./cs > /tmp/cs-history.out
          grep -q 'alias' /tmp/cs-history.out
          printf '%s\n' 'echo `echo substituted`' > /tmp/cs-sub.cs
          ./cs /tmp/cs-sub.cs > /tmp/cs-sub.out
          grep -qx 'substituted' /tmp/cs-sub.out
          test -n "$HOME"
          printf '%s\n' 'echo "$HOME"' > /tmp/cs-env.cs
          ./cs /tmp/cs-env.cs > /tmp/cs-env.out
          test -n "$(cat /tmp/cs-env.out)"
          printf '%s\n' 'CC = "clang"' 'FLAGS = "-std=c23 -O3 -Wall -Wextra -Werror"' 'SOURCE = "cs.c"' 'BIN = "/tmp/cs-built"' 'CC FLAGS SOURCE -o BIN' > /tmp/cs-build.cs
          ./cs /tmp/cs-build.cs
          test -x /tmp/cs-built

          printf '%s\n' 'numbers = [' '10,' '20,' '30,' '40' ']' 'echo numbers[0]' 'echo numbers[3]' 'echo numbers.length' 'numbers[1] = 25' 'echo numbers[1]' 'for (i = 0; i < numbers.length; ++i) { echo numbers[i] }' > /tmp/cs-arrays.cs
          ./cs /tmp/cs-arrays.cs > /tmp/cs-arrays.out
          printf '%s\n' '10' '40' '4' '25' '10' '25' '30' '40' > /tmp/cs-arrays.expected
          diff -u /tmp/cs-arrays.expected /tmp/cs-arrays.out

          printf '%s\n' 'false' 'if (status == 1 && !(1 == 0) || 0) { echo logical-ok }' > /tmp/cs-logical.cs
          ./cs /tmp/cs-logical.cs > /tmp/cs-logical.out
          grep -qx 'logical-ok' /tmp/cs-logical.out
          grep -q 'history' /tmp/cs-history.out
          printf '%s\n' 'true &' 'jobs' > /tmp/cs-jobs.cs
          ./cs /tmp/cs-jobs.cs > /tmp/cs-jobs.out 2>&1
          grep -q 'Running' /tmp/cs-jobs.out
          clang -std=c23 -O2 -Wall -Wextra -Werror test_pty.c -lutil -o test_pty
          ./test_pty
